    master-key: ${TV_MASTER_KEY:ZGV2LW9ubHktbWFzdGVyLWtleS0zMi1ieXRlcyEhISE=}
    audit-hmac-key: ${TV_AUDIT_HMAC_KEY:ZGV2LW9ubHktYXVkaXQtaG1hYy1rZXktMzJieXRlcyE=}
  seed:
    enabled: ${TV_SEED_ENABLED:true}
