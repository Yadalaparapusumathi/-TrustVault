# Rendered from /etc/nginx/templates/default.conf.template by the nginx-unprivileged entrypoint
# (envsubst). BACKEND_HOST defaults to "backend" and BACKEND_PORT to 8080 (see Dockerfile).

# Behind CloudFront (AWS deployment) the viewer's address and scheme arrive in CloudFront-* headers; the ALB in
# between is reachable only from CloudFront. Elsewhere these headers are absent (Caddy strips them) and the
# usual X-Forwarded-For chain is used.
map $http_cloudfront_viewer_address $tv_forwarded_for {
    ""                                   $proxy_add_x_forwarded_for;
    "~^\[?(?<viewer_ip>.+?)\]?:[0-9]+$"  $viewer_ip;
    default                              $proxy_add_x_forwarded_for;
}
map $http_cloudfront_forwarded_proto $tv_forwarded_proto {
    ""      $scheme;
    default $http_cloudfront_forwarded_proto;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 25m;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API (backend sets its own security headers; we do not add or override any here) ----
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $tv_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tv_forwarded_proto;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /actuator/health {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $tv_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tv_forwarded_proto;
        proxy_set_header Connection "";
    }

    location /actuator/ {
        return 404;
    }

    # ---- Static SPA ----
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
